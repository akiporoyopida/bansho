:root{
  --page:#f1f1f0;
  --frame:rgba(0,0,0,.10);
  --ink:#171717; --pill:rgba(0,0,0,.07); --track:rgba(0,0,0,.14);
  box-sizing:border-box;
  height:100%;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#000; --frame:rgba(255,255,255,.12); --ink:#fff; --pill:rgba(255,255,255,.13); --track:rgba(255,255,255,.2); }
}
:root[data-theme="dark"]{ --page:#000; --frame:rgba(255,255,255,.12); --ink:#fff; --pill:rgba(255,255,255,.13); --track:rgba(255,255,255,.2); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; height:100%; background:var(--page); color:#fff;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  font-family:"ZKG","Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
#app{ display:flex; flex-direction:column; align-items:center; }
#wrap{ position:relative; background:#000; border-radius:calc(var(--u,1px)*30); overflow:hidden; box-shadow:0 0 0 1px var(--frame); }
#cv{ display:block; cursor:pointer; touch-action:manipulation; }
#time{
  position:absolute; left:3.4%; bottom:2.4%; pointer-events:none; white-space:nowrap;
  font:400 max(11px, calc(var(--u,1px)*25))/1 "STIXr","STIX Two Text","Times New Roman",serif;
  font-variant-numeric:tabular-nums; color:rgba(255,255,255,.62); letter-spacing:.02em;
}
#bar{ display:flex; flex-direction:column; height:64px; }
#prog{ position:relative; height:18px; cursor:pointer; touch-action:none; }
#prog .track{ position:absolute; left:0; right:0; top:8px; height:3px; border-radius:2px; background:var(--track); overflow:hidden; }
#prog .fill{ position:absolute; left:0; top:0; bottom:0; width:0; background:var(--ink); }
#prog .tick{ position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--page); }
#prog:focus-visible{ outline:2px solid var(--ink); outline-offset:1px; border-radius:4px; }
#ui{ flex:1; display:flex; align-items:center; gap:2px; }
#ui .grow{ margin-left:auto; display:flex; align-items:center; gap:4px; }
#ui button{
  appearance:none; -webkit-appearance:none; border:0; margin:0; background:transparent; color:var(--ink);
  opacity:.78; cursor:pointer; border-radius:999px; width:40px; height:40px; padding:0;
  display:flex; align-items:center; justify-content:center; white-space:nowrap;
  transition:opacity .15s, background-color .15s;
}
#ui button:hover{ opacity:1; background:var(--pill); }
#ui button:focus-visible{ outline:2px solid var(--ink); outline-offset:1px; opacity:1; }
#ui button svg{ width:22px; height:22px; display:block; overflow:visible; }
#ui .txt{ width:auto; padding:0 12px; font:500 13px/1 "ZKG","Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif; letter-spacing:.04em; }
#speed{ font:400 16px/1 "STIXr","STIX Two Text","Times New Roman",serif !important; min-width:44px; }
#step[aria-pressed="true"]{ opacity:1; background:var(--pill); }
#step[aria-pressed="true"]::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; margin-right:7px; flex:none; }
#ui .txt rt{ font-size:.62em; letter-spacing:0; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
html.export #bar, html.export #time{ display:none; }
html.export #wrap{ border-radius:0; box-shadow:none; }
html.export body{ background:#000; }
</style>

</div>

  <div id="ui">

<script>
(() => {
'use strict';
/*
  Lesson animation engine — shared by every lesson (lessons/<slug>/lesson.js).
  build: lesson.py wraps  engine.js + lesson.js  in one closure, so lesson code can call everything here directly.
  API reference: ../references/engine-api.md
  Logical canvas 1080x1350. renderAt(t) is deterministic: the same t always draws the same frame (needed for MP4 export).
*/
const W = 1080, H = 1350;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
const EXPORT = /[?&]export=1/.test(location.search);
if (EXPORT) document.documentElement.classList.add('export');
let K = 1, NOW = 0;

/* ---------- colors & fonts ---------- */
// palette: lessons give these colours a meaning, e.g. Object.assign(RGB, { map: RGB.red, real: RGB.blue })
const RGB = { w:[255,255,255], red:[255,123,114], blue:[134,168,255], green:[118,214,160], amber:[255,196,106], violet:[190,162,255] };
const col = (c, a = 1) => { const v = Array.isArray(c) ? c : (RGB[c] || RGB.w); return `rgba(${v[0] | 0},${v[1] | 0},${v[2] | 0},${a})`; };
const mixRGB = (a, b, t) => { const A = Array.isArray(a) ? a : RGB[a], B = Array.isArray(b) ? b : RGB[b]; return [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t]; };
const JPF = '"ZKG","Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP",sans-serif';
const MRF = '"STIXr","STIX Two Text","Times New Roman",serif';
const MIF = '"STIXi","STIX Two Text","Times New Roman",serif';
const fJ = (s, w = 400) => `${w} ${s}px ${JPF}`;
const fM = s => `400 ${s}px ${MRF}`;
const fI = s => `italic 400 ${s}px ${MIF}`;

/* ---------- math helpers ---------- */
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eo = t => 1 - Math.pow(1 - t, 3);
const eback = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const S = (t, a, b) => eio(seg(t, a, b));
const lerp = (a, b, t) => a + (b - a) * t;
const lp = (p, q, t) => [lerp(p[0], q[0], t), lerp(p[1], q[1], t)];
const DEG = Math.PI / 180;

/* ---------- drawing helpers ---------- */
function setStroke(c, w, a, dash, glow){
  ctx.strokeStyle = col(c, a); ctx.lineWidth = w;
  ctx.setLineDash(dash || []);
  if (glow){ ctx.shadowColor = col(c, Math.min(1, .75 * a)); ctx.shadowBlur = glow * K; }
}
function line(a, b, p = 1, c = 'w', w = 2, al = 1, o = {}){
  if (p <= 0 || al <= 0) return;
  const e = lp(a, b, p);
  ctx.save(); setStroke(c, w, al, o.dash, o.glow);
  if (o.flow) ctx.lineDashOffset = -o.flow;
  ctx.lineCap = o.cap || 'round';
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(e[0], e[1]); ctx.stroke(); ctx.restore();
}
function poly(pts, p = 1, c = 'w', w = 2, al = 1, o = {}){
  if (p <= 0 || al <= 0) return;
  const L = []; let total = 0;
  for (let i = 1; i < pts.length; i++){ const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(d); total += d; }
  let rem = total * p;
  ctx.save(); setStroke(c, w, al, o.dash, o.glow); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (o.flow) ctx.lineDashOffset = -o.flow;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && rem > 0; i++){
    const d = L[i - 1];
    if (rem >= d){ ctx.lineTo(pts[i][0], pts[i][1]); rem -= d; }
    else { const t = rem / d; ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], t), lerp(pts[i - 1][1], pts[i][1], t)); rem = 0; }
  }
  ctx.stroke(); ctx.restore();
}
function fillPoly(pts, c, al){
  if (al <= 0) return;
  ctx.save(); ctx.fillStyle = col(c, al); ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function dot(p, r, c = 'w', al = 1, glow = 0){
  if (al <= 0 || r <= 0) return;
  ctx.save(); ctx.fillStyle = col(c, al);
  if (glow){ ctx.shadowColor = col(c, Math.min(1, .9 * al)); ctx.shadowBlur = glow * K; }
  ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function ring(p, r, c = 'w', al = 1, w = 2){
  if (al <= 0 || r <= 0) return;
  ctx.save(); ctx.strokeStyle = col(c, al); ctx.lineWidth = w; ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}
/* ---------- furigana (ruby) : write kanji as "{漢字|かんじ}" ---------- */
const RUBY_RE = /\{([^|}]+)\|([^}]+)\}|\$([^$]+)\$/g;           // {漢字|かんじ} ruby, $A′$ math-italic letters
const hasRuby = s => typeof s === 'string' && (s.indexOf('{') >= 0 || s.indexOf('$') >= 0);
const plain = s => s.replace(RUBY_RE, (m0, b, r, mth) => mth != null ? mth : b);
function rubySegs(str){
  const out = []; let last = 0, m;

/* ---------- header / caption / formula ---------- */
function legend(y, a){ // colour key under the title; items come from startLesson({ legend })

  const total = ws.reduce((acc, w) => acc + r * 2 + g + w, 0) + between * (LEGEND.length - 1);

  LEGEND.forEach((it, i) => {

    text(it.label, x, y, LF, 'w', .72 * a, 'left'); x += ws[i] + between;

}
function caption(str, a, dy){
  if (!str || a <= 0) return;
  const lines = str.split('\n'), lh = 72, y0 = 1058 - (lines.length - 1) * lh / 2;
  lines.forEach((ln, i) => {
    let size = 40; const w = twidth(ln, fJ(size)); if (w > 960) size = Math.floor(40 * 960 / w);

}
function bottomFormula(key, a, beat, p){
  if (!key || a <= 0) return;
  const L = formula(FORM[key](beat ? p : 99), W / 2, 1192, 52, a);
  if (beat && beat.ul){ const [i0, i1, t0, t1] = beat.ul; answerLine(L.boxes[i0].x0 + 8, L.boxes[i1].x1 + 4, 1192 + 44, S(p, t0, t1), 'w', .9 * a); }
}
function beatIndex(sc, L){ let bi = 0; sc.beats.forEach((b, i) => { if (L >= b.t) bi = i; }); return bi; }
function drawOverlay(sc, L){
  const bi = beatIndex(sc, L), b = sc.beats[bi], p = L - b.t, pb = bi > 0 ? sc.beats[bi - 1] : null;
  if (pb) caption(pb.cap, 1 - seg(p, 0, .22), 0);
  const cd = b.cd == null ? .15 : b.cd, fi = S(p, cd, cd + .45);

  if (pb && pb.f) bottomFormula(pb.f, 1 - seg(p, 0, .25), pb, 99);   // keep the previous step's answer underline while it fades (step-mode pause frame)

function sceneAt(t){ for (let i = 0; i < SCENES.length; i++) if (t < SCENES[i].g1 + GAP / 2) return i; return SCENES.length - 1; }

  NOW = t;

  $('icoPause').style.display = playing ? '' : 'none';
  $('icoReplay').style.display = !playing && ended ? '' : 'none';
  $('play').setAttribute('aria-label', playing ? '一時停止' : ended ? 'もう一度再生' : '再生');
  const si = sceneAt(T), sc = SCENES[si], L = Math.max(0, Math.min(sc.dur, T - sc.g0)), cap = plain(sc.beats[beatIndex(sc, L)].cap).replace(/\n/g, '');

function draw(){ if (!SCENES.length) return; renderAt(T); updateUI(); }

function seek(t){ T = Math.max(0, Math.min(TOTAL, t)); draw(); }
function tick(now){

    const dt = Math.min(.1, (now - last) / 1000) * speed;
    let nt = T + dt;
    if (stepMode){ const p = PAUSES.find(x => x > T + 1e-6 && x <= nt); if (p !== undefined){ nt = p; playing = false; } }
    if (nt >= TOTAL){ nt = TOTAL; playing = false; }

  }

}
function goNext(){
  const here = NAV.find(x => Math.abs(x - T) < .06);
  if (!playing && here !== undefined){ seek(here); setPlaying(true); return; }
  const t = NAV.find(x => x > T + .05); seek(t === undefined ? TOTAL : t); if (t !== undefined) setPlaying(true);
}
function goPrev(){ let t = 0; for (const x of NAV) if (x < T - .6) t = x; seek(t); setPlaying(true); }
function fit(){
  if (EXPORT){
    wrap.style.width = W + 'px'; wrap.style.height = H + 'px';

  }

}

// lesson.js ends with: startLesson({ scenes, forms, legend, poster, gap })
function startLesson(L){
  SCENES = L.scenes; FORM = L.forms || {}; LEGEND = L.legend || null; POSTER = L.poster || 0;
  if (L.gap != null) GAP = L.gap;
  let acc = 0;
  SCENES.forEach((s, i) => { s.g0 = acc; s.g1 = acc + s.dur; acc = s.g1 + (i < SCENES.length - 1 ? GAP : 0); });
  TOTAL = acc; NAV = []; PAUSES = [];
  SCENES.forEach(s => s.beats.forEach((b, bi) => {
    NAV.push(s.g0 + (bi === 0 ? 0 : b.t));
    PAUSES.push(s.g0 + (bi < s.beats.length - 1 ? s.beats[bi + 1].t : s.dur));
  }));
  SCENES.slice(1).forEach(s => { const d = document.createElement('div'); d.className = 'tick'; d.style.left = (s.g0 / TOTAL * 100) + '%'; prog.querySelector('.track').appendChild(d); });
  prog.setAttribute('aria-valuemax', String(Math.round(TOTAL)));
  window.__lesson = {                       // used by lesson.py (shots / export)
    total: TOTAL, pauses: PAUSES.slice(), nav: NAV.slice(),
    scenes: SCENES.map(s => ({ title: plain(s.title), g0: s.g0, g1: s.g1, beats: s.beats.length })),
    render: t => { renderAt(t); return true; }, ready: false

  ensureFonts().then(() => {

    if (EXPORT){ window.__lesson.ready = true; return; }
    if (reduce){ T = POSTER; stepMode = true; $('step').setAttribute('aria-pressed', 'true'); draw(); }
    else play();

  });
}

// @title 対頂角・同位角・錯角（問題編）
/*
  数学 中2「対頂角・同位角・錯角 ② 問題編」（板書2枚 → source/）
  読み取り・検算・構成は notes.md。エンジンの使い方は .claude/skills/whiteboard-lesson-video/references/engine-api.md

// 色の意味：青＝わかっている角（問題の角と、とちゅうでわかった角）、赤＝求める角（先生の赤ペン）
Object.assign(RGB, { given: RGB.blue, answer: RGB.red });

/* ---------- 角の図の道具（kaku-kihon / kaku-mondai / kaku-ouyou で共通） ---------- */
// 向きは「数学の角度（度）」：0°＝右、90°＝上、180°＝左、270°＝下（画面は y が下向きなので sin を反転）
const at = (P, d, r) => [P[0] + r * Math.cos(d * DEG), P[1] - r * Math.sin(d * DEG)];
function rotP(P, O, d){ // 点 P を O のまわりに d 度（反時計回り）
  const c = Math.cos(d * DEG), s = Math.sin(d * DEG), dx = P[0] - O[0], dy = P[1] - O[1];
  return [O[0] + dx * c + dy * s, O[1] - dx * s + dy * c];
}
function meet(P, dp, Q, dq){ // P を通る向き dp の直線と、Q を通る向き dq の直線の交点
  const a = [Math.cos(dp * DEG), -Math.sin(dp * DEG)], b = [Math.cos(dq * DEG), -Math.sin(dq * DEG)];
  const den = a[0] * b[1] - a[1] * b[0], t = ((Q[0] - P[0]) * b[1] - (Q[1] - P[1]) * b[0]) / den;
  return [P[0] + a[0] * t, P[1] + a[1] * t];
}
function wedge(C, d0, d1, r, p, c, al = 1, fa = .2, glow = 0, w = 2.4){ // 角：向き d0 → d1 を反時計回りに（弧とうすいぬり）
  if (p <= 0 || al <= 0) return;
  const e = d0 + (d1 - d0) * p;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(C[0], C[1]); ctx.arc(C[0], C[1], r, -d0 * DEG, -e * DEG, true); ctx.closePath();
  ctx.fillStyle = col(c, fa * al); ctx.fill();
  setStroke(c, w, al, null, glow);
  ctx.beginPath(); ctx.arc(C[0], C[1], r, -d0 * DEG, -e * DEG, true); ctx.stroke();
  ctx.restore();
}
function arcA(C, d0, d1, r, p, c = 'w', al = 1, w = 1.8){ angleArc(C, r, -d0 * DEG, -d1 * DEG, p, c, al, w); }
const mid = (C, d0, d1, r) => at(C, (d0 + d1) / 2, r);
function ray(P, d, r0, r1, p = 1, c = 'w', w = 2.2, al = .85, o = {}){ line(at(P, d, r0), at(P, d, r1), p, c, w, al, o); }
function parMark(P, d, c = 'w', al = 1, s = 15, glow = 0){ // 平行のしるし「>」（向き d のほうを指す）
  if (al <= 0) return;
  poly([at(P, d + 150, s), P, at(P, d - 150, s)], 1, c, 2.4, al, { glow });
}
const degT = (s, P, size, c = 'w', al = 1, glow = 0) => text(s, P[0], P[1], fM(size), c, al, 'center', 'middle', glow);
const ANG = (s, c = 'w', o = {}) => [j('∠', c, o), v(s, c, o)];   // 下の数式の「∠x」（∠ は日本語フォントにしかない）

/* ---------- このレッスンの小さな道具 ---------- */
const hold = (lt, t0, t1, te) => S(lt, t0, t1) * (1 - S(lt, te, te + .5));   // t0〜t1 で出て、te から消える
const tag = (s, P, c, al) => text(s, P[0], P[1], fJ(26, 500), c, al);      // 「左上」などの位置のことば
const lbl = (s, P, c = 'w', al = 1, glow = 0) => text(s, P[0], P[1] - 4, fI(42), c, al, 'center', 'middle', glow);
function glowL(a, b, al){ if (al > 0) line(a, b, 1, 'w', 3.2, .9 * al, { glow: 10 }); }
function travel(A, B, t0, t1, lt){ const f = S(lt, t0, t1); if (f > 0 && f < 1) dot(lp(A, B, f), 7, 'w', 1, 14); }
// 対頂角：C のまわりに 180°回す
function spinV(C, d0, d1, r, rp){
  if (rp <= 0 || rp >= 1) return;
  wedge(C, d0 + 180 * rp, d1 + 180 * rp, r, 1, mixRGB('given', 'answer', rp), 1, .22, 12);
}
// 錯角：交わる線にそって C → C2 へ移しながら向きを 180°変える（c1 は行き先の色）
function slideZ(C, C2, d0, d1, r, rp, c1 = 'given'){
  if (rp <= 0 || rp >= 1) return;
  wedge(lp(C, C2, rp), d0 + 180 * rp, d1 + 180 * rp, r, 1, c1 === 'given' ? 'given' : mixRGB('given', c1, rp), 1, .22, 12);
}
function lm(y, x0, x1, p, name, al = 1){ // 平行な直線 ℓ / m と名前
  line([x0, y], [x1, y], p, 'w', 2.2, .85 * al);
  text(name, x1 + 36, y - (name === 'm' ? 4 : 0), fI(46), 'w', .9 * S(p, .7, 1) * al);
}
