:root{
  --page:#f1f1f0;
  --frame:rgba(0,0,0,.10);
  --ink:#171717; --pill:rgba(0,0,0,.07); --track:rgba(0,0,0,.14);
  box-sizing:border-box;
  height:100%;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#000; --frame:rgba(255,255,255,.12); --ink:#fff; --pill:rgba(255,255,255,.13); --track:rgba(255,255,255,.2); }
}
:root[data-theme="dark"]{ --page:#000; --frame:rgba(255,255,255,.12); --ink:#fff; --pill:rgba(255,255,255,.13); --track:rgba(255,255,255,.2); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; height:100%; background:var(--page); color:#fff;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  font-family:"ZKG","Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
#app{ display:flex; flex-direction:column; align-items:center; }
#wrap{ position:relative; background:#000; border-radius:calc(var(--u,1px)*30); overflow:hidden; box-shadow:0 0 0 1px var(--frame); }
#cv{ display:block; cursor:pointer; touch-action:manipulation; }
#time{
  position:absolute; left:3.4%; bottom:2.4%; pointer-events:none; white-space:nowrap;
  font:400 max(11px, calc(var(--u,1px)*25))/1 "STIXr","STIX Two Text","Times New Roman",serif;
  font-variant-numeric:tabular-nums; color:rgba(255,255,255,.62); letter-spacing:.02em;
}
#bar{ display:flex; flex-direction:column; height:64px; }
#prog{ position:relative; height:18px; cursor:pointer; touch-action:none; }
#prog .track{ position:absolute; left:0; right:0; top:8px; height:3px; border-radius:2px; background:var(--track); overflow:hidden; }
#prog .fill{ position:absolute; left:0; top:0; bottom:0; width:0; background:var(--ink); }
#prog .tick{ position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--page); }
#prog:focus-visible{ outline:2px solid var(--ink); outline-offset:1px; border-radius:4px; }
#ui{ flex:1; display:flex; align-items:center; gap:2px; }
#ui .grow{ margin-left:auto; display:flex; align-items:center; gap:4px; }
#ui button{
  appearance:none; -webkit-appearance:none; border:0; margin:0; background:transparent; color:var(--ink);
  opacity:.78; cursor:pointer; border-radius:999px; width:40px; height:40px; padding:0;
  display:flex; align-items:center; justify-content:center; white-space:nowrap;
  transition:opacity .15s, background-color .15s;
}
#ui button:hover{ opacity:1; background:var(--pill); }
#ui button:focus-visible{ outline:2px solid var(--ink); outline-offset:1px; opacity:1; }
#ui button svg{ width:22px; height:22px; display:block; overflow:visible; }
#ui .txt{ width:auto; padding:0 12px; font:500 13px/1 "ZKG","Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif; letter-spacing:.04em; }
#speed{ font:400 16px/1 "STIXr","STIX Two Text","Times New Roman",serif !important; min-width:44px; }
#step[aria-pressed="true"]{ opacity:1; background:var(--pill); }
#step[aria-pressed="true"]::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; margin-right:7px; flex:none; }
#ui .txt rt{ font-size:.62em; letter-spacing:0; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
html.export #bar, html.export #time{ display:none; }
html.export #wrap{ border-radius:0; box-shadow:none; }
html.export body{ background:#000; }
</style>
</head>

<div id="wrap">

  <span id="time" aria-hidden="true">0:00 / 0:00</span>

/* ---------- formula engine ---------- */
const n = (s, c = 'w', o = {}) => Object.assign({ k: 'n', s, c }, o);   // number (upright)
const u = (s, c = 'w', o = {}) => Object.assign({ k: 'u', s, c }, o);   // unit
const op = (s, o = {}) => Object.assign({ k: 'o', s, c: 'w' }, o);      // operator
const j = (s, c = 'w', o = {}) => Object.assign({ k: 'j', s, c }, o);   // Japanese
const fr = (num, den, o = {}) => Object.assign({ k: 'f', num, den, c: 'w' }, o);
const ar = (dir = 'r', w = 1.3, o = {}) => Object.assign({ k: 'a', dir, w, c: 'w' }, o);
const sp = w => ({ k: 's', w });
const v = (s, c = 'w', o = {}) => Object.assign({ k: 'v', s, c }, o);   // italic letter (A, A′ …)

function tokW(t, s){
  switch (t.k){
    case 'n': ctx.font = fM(s); return ctx.measureText(t.s).width;
    case 'v': ctx.font = fI(s); return ctx.measureText(t.s).width + s * .08;
    case 'u': ctx.font = fM(s); return ctx.measureText(t.s).width + s * .2;
    case 'o': ctx.font = fM(s); return ctx.measureText(t.s).width + s * .56;
    case 'j': { const js = s * (t.z || .68); return twidth(t.s, fJ(js, t.wt || 400)) + s * .24; }
    case 'f': { const fs = s * (t.z || .86); return Math.max(seqW(t.num, fs), seqW(t.den, fs)) + s * .36; }
    case 'a': return s * (t.w + .5);
    case 's': return s * t.w;
  }
  return 0;
}
function seqW(ts, s){ let w = 0; for (const t of ts) w += tokW(t, s); return w; }
function strikeChars(t, x, yc, s, a){
  ctx.save(); ctx.font = fM(s);
  const ch = [...t.s], N = ch.length; let cx = x;
  ctx.strokeStyle = col(t.sc || 'w', a); ctx.lineWidth = Math.max(1.6, s * .04); ctx.lineCap = 'round';
  for (let i = 0; i < N; i++){
    const cw = ctx.measureText(ch[i]).width, pi = clamp01(t.st * N - i);
    if (pi > 0){
      const x0 = cx + cw * .12, y0 = yc + s * .34, x1 = cx + cw * .88, y1 = yc - s * .38;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(lerp(x0, x1, pi), lerp(y0, y1, pi)); ctx.stroke();

}
function drawTok(t, x, yc, s, w, a){
  const c = t.c || 'w';

    const fs = s * (t.z || .86), nw = seqW(t.num, fs), dw = seqW(t.den, fs), cx = x + w / 2;
    drawSeq(t.num, cx - nw / 2, yc - fs * .54, fs, a);
    const dxr = t.den.some(k => k.k === 'j' && hasRuby(k.s)) ? fs * .31 : 0; // room for ruby under the bar
    drawSeq(t.den, cx - dw / 2, yc + fs * .54 + dxr, fs, a);
    const bw = Math.max(nw, dw) + s * .16;
    line([cx - bw / 2, yc], [cx + bw / 2, yc], 1, c, Math.max(1.8, s * .045), a, { cap: 'butt' });
    return;
  }
  ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  if (t.g){ ctx.shadowColor = col(c, .85 * a); ctx.shadowBlur = t.g * K; }
  switch (t.k){
    case 'n': ctx.font = fM(s); ctx.fillStyle = col(c, a * (t.st ? 1 - .55 * t.st : 1)); ctx.fillText(t.s, x, yc + s * .335); break;
    case 'v': ctx.font = fI(s); ctx.fillStyle = col(c, a); ctx.fillText(t.s, x + s * .02, yc + s * .335); break;
    case 'u': ctx.font = fM(s); ctx.fillStyle = col(c, a); ctx.fillText(t.s, x + s * .2, yc + s * .335); break;
    case 'o': ctx.font = fM(s); ctx.fillStyle = col(c, a); ctx.fillText(t.s, x + s * .28, yc + s * .25); break;
    case 'j': {
      const js = s * (t.z || .68), f = fJ(js, t.wt || 400); ctx.fillStyle = col(c, a);
      if (hasRuby(t.s)){ const rf = rubyFont(f), rs = Math.max(12, js * .5); rubyDraw(rubyLayout(t.s, f, rf), x + s * .12, yc + js * .36, f, rf, yc - js * .57 - rs / 2); }
      else { ctx.font = f; ctx.fillText(t.s, x + s * .12, yc + js * .36); }

    }
    case 'a': {
      const x0 = x + s * .25, x1 = x0 + s * t.w, h = s * .17;

      ctx.beginPath(); ctx.moveTo(x0, yc); ctx.lineTo(x1, yc);
      if (t.dir === 'r' || t.dir === 'lr'){ ctx.moveTo(x1 - h, yc - h * .72); ctx.lineTo(x1, yc); ctx.lineTo(x1 - h, yc + h * .72); }
      if (t.dir === 'l' || t.dir === 'lr'){ ctx.moveTo(x0 + h, yc - h * .72); ctx.lineTo(x0, yc); ctx.lineTo(x0 + h, yc + h * .72); }
      ctx.stroke();
      if (t.lab){ ctx.shadowBlur = 0; ctx.font = fM(s * .5); ctx.fillStyle = col('w', a * .75); ctx.textAlign = 'center'; ctx.fillText(t.lab, (x0 + x1) / 2, yc - s * .26); }

function drawSeq(toks, x, yc, s, al = 1, boxes = null){
  for (const t of toks){
    const w = tokW(t, s), a = al * (t.a == null ? 1 : t.a);
    if (a > .002 && t.k !== 's') drawTok(t, x, yc, s, w, a);

}
function formula(toks, cx, yc, s, al = 1){
  const w = seqW(toks, s), boxes = [];
  drawSeq(toks, cx - w / 2, yc, s, al, boxes);

}
function formulaL(toks, x, yc, s, al = 1){ const boxes = []; const x1 = drawSeq(toks, x, yc, s, al, boxes); return { x0: x, x1, boxes }; }
function layoutF(toks, cx, s){
  const w = seqW(toks, s), boxes = []; let x = cx - w / 2;
  for (const t of toks){ const tw = tokW(t, s); boxes.push({ x0: x, x1: x + tw }); x += tw; }

function sceneAt(t){ for (let i = 0; i < SCENES.length; i++) if (t < SCENES[i].g1 + GAP / 2) return i; return SCENES.length - 1; }

let T = 0, playing = false, last = 0, speed = 1, stepMode = false, lastCap = '';
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function updateUI(){
  if (EXPORT) return;
  $('time').textContent = fmt(T) + ' / ' + fmt(TOTAL);
  $('prog').querySelector('.fill').style.width = (T / TOTAL * 100) + '%';
  $('prog').setAttribute('aria-valuenow', String(Math.round(T)));
  $('prog').setAttribute('aria-valuetext', fmt(T));
  const ended = T >= TOTAL - 1e-3;
  $('icoPlay').style.display = !playing && !ended ? '' : 'none';
  $('icoPause').style.display = playing ? '' : 'none';
  $('icoReplay').style.display = !playing && ended ? '' : 'none';
  $('play').setAttribute('aria-label', playing ? '一時停止' : ended ? 'もう一度再生' : '再生');
  const si = sceneAt(T), sc = SCENES[si], L = Math.max(0, Math.min(sc.dur, T - sc.g0)), cap = plain(sc.beats[beatIndex(sc, L)].cap).replace(/\n/g, '');
  if (cap !== lastCap){ lastCap = cap; $('sr').textContent = cap; }
}
function draw(){ if (!SCENES.length) return; renderAt(T); updateUI(); }
function setPlaying(v){ playing = v; last = performance.now(); updateUI(); }
function play(){ if (T >= TOTAL - 1e-3) T = 0; setPlaying(true); }
function seek(t){ T = Math.max(0, Math.min(TOTAL, t)); draw(); }
function tick(now){
  if (playing){
    const dt = Math.min(.1, (now - last) / 1000) * speed;
    let nt = T + dt;
    if (stepMode){ const p = PAUSES.find(x => x > T + 1e-6 && x <= nt); if (p !== undefined){ nt = p; playing = false; } }
    if (nt >= TOTAL){ nt = TOTAL; playing = false; }
    T = nt; draw();
  }
  last = now;
  requestAnimationFrame(tick);
}
function goNext(){
  const here = NAV.find(x => Math.abs(x - T) < .06);
  if (!playing && here !== undefined){ seek(here); setPlaying(true); return; }
  const t = NAV.find(x => x > T + .05); seek(t === undefined ? TOTAL : t); if (t !== undefined) setPlaying(true);
}
function goPrev(){ let t = 0; for (const x of NAV) if (x < T - .6) t = x; seek(t); setPlaying(true); }
function fit(){
  if (EXPORT){
    wrap.style.width = W + 'px'; wrap.style.height = H + 'px';
    cv.width = W; cv.height = H; cv.style.width = W + 'px'; cv.style.height = H + 'px'; K = 1; draw(); return;
  }
  const bw = document.body.clientWidth, bh = document.body.clientHeight, barH = 64;
  const pad = Math.min(16, bw * .03);
  const s = Math.min((bw - pad * 2) / W, (bh - pad * 2 - barH) / H);
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  wrap.style.width = cw + 'px'; wrap.style.height = ch + 'px';
  wrap.style.setProperty('--u', s + 'px');
  $('bar').style.width = cw + 'px';
  $('step').innerHTML = cw < 400 ? '<span class="lbl">ステップ</span>' : '<span class="lbl">ステップで<ruby>止<rt>と</rt></ruby>める</span>';
  const dpr = window.devicePixelRatio || 1;
  K = Math.min(cw * dpr / W, 2);
  cv.width = Math.round(W * K); cv.height = Math.round(H * K);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  draw();
}

// lesson.js ends with: startLesson({ scenes, forms, legend, poster, gap })
function startLesson(L){
  SCENES = L.scenes; FORM = L.forms || {}; LEGEND = L.legend || null; POSTER = L.poster || 0;
  if (L.gap != null) GAP = L.gap;
  let acc = 0;
  SCENES.forEach((s, i) => { s.g0 = acc; s.g1 = acc + s.dur; acc = s.g1 + (i < SCENES.length - 1 ? GAP : 0); });
  TOTAL = acc; NAV = []; PAUSES = [];
  SCENES.forEach(s => s.beats.forEach((b, bi) => {
    NAV.push(s.g0 + (bi === 0 ? 0 : b.t));
    PAUSES.push(s.g0 + (bi < s.beats.length - 1 ? s.beats[bi + 1].t : s.dur));
  }));
  SCENES.slice(1).forEach(s => { const d = document.createElement('div'); d.className = 'tick'; d.style.left = (s.g0 / TOTAL * 100) + '%'; prog.querySelector('.track').appendChild(d); });
  prog.setAttribute('aria-valuemax', String(Math.round(TOTAL)));
  window.__lesson = {                       // used by lesson.py (shots / export)
    total: TOTAL, pauses: PAUSES.slice(), nav: NAV.slice(),
    scenes: SCENES.map(s => ({ title: plain(s.title), g0: s.g0, g1: s.g1, beats: s.beats.length })),
    render: t => { renderAt(t); return true; }, ready: false
  };
  ensureFonts().then(() => {
    fit();
    if (EXPORT){ window.__lesson.ready = true; return; }
    if (reduce){ T = POSTER; stepMode = true; $('step').setAttribute('aria-pressed', 'true'); draw(); }
    else play();
    requestAnimationFrame(tick);
  });
}

  rightMark(T.B, [-1, 0], [0, -1], sz * .45, .6 * la);
  text('A', T.A[0] - sz * .7, T.A[1] + sz * .5, fI(sz), 'w', .9 * la);
  text('B', T.B[0] + sz * .7, T.B[1] + sz * .5, fI(sz), 'w', .9 * la);
  text('C', T.C[0] + sz * .7, T.C[1] - sz * .3, fI(sz), 'w', .9 * la);
}
function shade(T, P, al){ // △APC（面積 y）
  if (al <= 0) return;
  fillPoly([T.A, P, T.C], 'answer', .16 * al);
  poly([T.A, P, T.C], 1, 'answer', 1.6, .6 * al);
}
function pDot(P, al, lab, off = [0, 36], sz = 38){
  if (al <= 0) return;
  dot(P, 7, 'w', al, 14);
  if (lab > 0) text('P', P[0] + off[0], P[1] + off[1], fI(sz), 'w', .95 * lab);
}
function glowSeg(a, b, c, al, w = 4){ if (al > 0) line(a, b, 1, c, w, al, { glow: 12 }); }
function under(L, i, s, y, al){ // 式のトークン i の下に「底辺」「高さ」などの小さな書きこみ
  if (al <= 0) return;
  const b = L.boxes[i], cx = (b.x0 + b.x1) / 2;
  text(s, cx, y, fJ(26, 500), 'w', .7 * al);
}
function underR(L, i0, i1, s, y, al){ // トークン i0〜i1 のまん中の下
  if (al <= 0) return;
  const cx = (L.boxes[i0].x0 + L.boxes[i1].x1) / 2;
  line([L.boxes[i0].x0 + 4, y - 30], [L.boxes[i1].x1 - 4, y - 30], 1, 'w', 1.4, .5 * al);
  text(s, cx, y, fJ(26, 500), 'w', .7 * al);
}

/* ----- 導入 ----- */
function drawIntro(lt){
  const T = BIG;

  drawQty(qtyLayout('4', 'cm', 490, 694, 38), 'given', la);
  const q3 = qtyLayout('3', 'cm', 0, 475, 38); q3.nx += 740 - q3.x0; q3.ux += 740 - q3.x0; drawQty(q3, 'given', la);
  // b1：P が A を出発して AB 上を進む（1つの点）
  const x = 2.5 * S(lt, 6.2, 8.2), pa = S(lt, 5.8, 6.2);
  const P = Pat(T, x);
  shade(T, P, S(lt, 6.4, 7.0));
  if (x > .05) glowSeg(T.A, P, 'given', .9 * S(lt, 6.4, 6.8), 3.2);
  pDot(P, pa, pa);
  const xa = S(lt, 8.2, 8.7);
  formula([v('x', 'given'), u('cm', 'given')], (T.A[0] + P[0]) / 2, 610, 36, xa);
  formula([v('y', 'answer'), u('cm²', 'answer')], 600, 560, 36, S(lt, 8.8, 9.3));
}

/* ----- (1) P が AB 上 ----- */
function drawS1(lt){
  const T = BIG;
  triangle(T, 1);
  const x = lt < 19.4 ? 2.5 : lerp(2.5, 4, S(lt, 19.6, 21.2)), P = Pat(T, x);
  const atB = S(lt, 20.6, 21.2);
  shade(T, P, 1 - atB * .3);
  drawQty(qtyLayout('4', 'cm', 490, 694, 38), 'given', .45);
  // b0：底辺 AP＝x
  glowSeg(T.A, P, 'given', .95 * S(lt, 1.0, 1.5), 3.4);
  formula([v('x', 'given'), u('cm', 'given')], (T.A[0] + P[0]) / 2, 610, 36, S(lt, 1.3, 1.8) * (1 - S(lt, 19.4, 19.8)));
  text('{底辺|ていへん}', (T.A[0] + P[0]) / 2, 566, fJ(26, 500), 'given', .8 * S(lt, 2.0, 2.5) * (1 - S(lt, 19.4, 19.8)));
  // b1：高さ BC＝3
  glowSeg(T.B, T.C, 'given', .95 * S(lt, 6.8, 7.3), 3.4);
  const ha = lerp(.45, 1, S(lt, 6.8, 7.3));
  const q3 = qtyLayout('3', 'cm', 0, 475, 38); q3.nx += 740 - q3.x0; q3.ux += 740 - q3.x0; drawQty(q3, 'given', ha);
  text('{高|たか}さ', 740, 420, fJ(26, 500), 'given', .8 * S(lt, 7.3, 7.8), 'left');
  pDot(P, 1, 1 - atB, [0, 36]);
  // b2：y＝x×3×½（下に「面積」「底辺」「高さ」の書きこみ）
  const ca = S(lt, 12.9, 13.5) * (1 - S(lt, 19.2, 19.7));
  if (ca > 0){
    const L = formula([v('y', 'answer'), op('='), v('x', 'given'), op('×'), n('3', 'given'), op('×'), HALF()], 540, 812, 58, ca);
    under(L, 0, '{面積|めんせき}', 890, ca); under(L, 2, '{底辺|ていへん}', 890, ca); under(L, 4, '{高|たか}さ', 890, ca);
  }
  // b3：B に着くと x＝4、y＝6
  const da = S(lt, 21.2, 21.8);
  if (da > 0){
    const L = formula([v('x'), op('='), n('4'), sp(.8), ar('r', 1.3), sp(.8), v('y'), op('='), fr([n('3')], [n('2')]), op('×'), n('4'), op('='), n('6', 'answer')], 540, 812, 54, da);
    answerLine(L.boxes[12].x0 - 10, L.boxes[12].x1 + 10, 862, S(lt, 22.2, 23.0), 'w', .9);
  }
}

/* ----- (2) P が BC 上 ----- */
function drawS2(lt){
  const T = BIG;
  triangle(T, 1);
  const x = lerp(4, 5.5, S(lt, .4, 1.8)), P = Pat(T, x);
  shade(T, P, 1);
  // b0：A→B→P が x cm
  const pa = S(lt, 2.0, 3.0) * (1 - S(lt, 12.8, 13.3));
  poly([T.A, T.B, P], S(lt, 2.0, 3.0), 'w', 3.4, .9 * (1 - S(lt, 12.8, 13.3)), { glow: 10 });
  formula([v('A'), v('B'), op('+'), v('B'), v('P'), op('='), v('x'), u('cm')], 490, 694, 38, S(lt, 2.8, 3.3) * (1 - S(lt, 12.8, 13.3)));   // x は AB だけでなく A→B→P の長さ
  // b1：PC＝4＋3−x
  glowSeg(P, T.C, 'given', .95 * S(lt, 7.0, 7.5), 3.4);
  const pc = S(lt, 7.4, 8.0);
  formulaL([n('(', 'given'), n('4', 'given'), op('+'), n('3', 'given'), op('−'), v('x', 'given'), n(')', 'given'), u('cm', 'given')], 740, (P[1] + T.C[1]) / 2, 34, pc);
  text('{底辺|ていへん}', 740, (P[1] + T.C[1]) / 2 - 48, fJ(26, 500), 'given', .8 * pc, 'left');
  // b2：高さ AB＝4
  glowSeg(T.A, T.B, 'given', .95 * S(lt, 13.4, 13.9), 3.4);
  const ha = S(lt, 13.6, 14.1);
  drawQty(qtyLayout('4', 'cm', 490, 694, 38), 'given', ha);
  text('{高|たか}さ', 490, 742, fJ(26, 500), 'given', .8 * ha);
  pDot(P, 1, 1, [-34, 0]);
  // b3：y＝(4＋3−x)×4×½
  const ca = S(lt, 19.9, 20.5);
  if (ca > 0){
    const L = formula([v('y', 'answer'), op('='), n('('), n('4'), op('+'), n('3'), op('−'), v('x'), n(')'), op('×'), n('4', 'given'), op('×'), HALF()], 540, 830, 56, ca);
    under(L, 0, '{面積|めんせき}', 906, ca); underR(L, 2, 8, '{底辺|ていへん}', 906, ca); under(L, 10, '{高|たか}さ', 906, ca);
  }
}

/* ----- (3) グラフ ----- */
const GO = [450, 880], GU = 70;
const G = (x, y) => [GO[0] + x * GU, GO[1] - y * GU];
function axes(a){
  if (a <= 0) return;
  grid(GO[0], GO[1] - 6 * GU, GO[0] + 7 * GU, GO[1], GU, .08 * a);
  arrow([GO[0] - 16, GO[1]], [GO[0] + 7.7 * GU, GO[1]], 1, 'w', 1.8, .8 * a, 11);
  arrow([GO[0], GO[1] + 16], [GO[0], GO[1] - 6.7 * GU], 1, 'w', 1.8, .8 * a, 11);
  for (let i = 1; i <= 7; i++) numC(String(i), G(i, 0)[0], GO[1] + 30, 26, 'w', .7 * a);
  for (let i = 1; i <= 6; i++) numC(String(i), GO[0] - 24, G(0, i)[1], 26, 'w', .7 * a);
  text('O', GO[0] - 22, GO[1] + 26, fI(28), 'w', .7 * a);
  formulaL([v('x'), n('(cm)')], GO[0] + 7.75 * GU, GO[1] + 4, 28, .8 * a);
  formula([v('y'), n('(cm²)')], GO[0], GO[1] - 6.7 * GU - 26, 28, .8 * a);
}
function drawS3(lt){
  const T = SML;
  const a0 = S(lt, .2, 1.2);
  triangle(T, a0, .85, 32);
  axes(S(lt, .6, 1.6));
  // P の動き（6.6〜9.8 秒で A→B、13.6〜16.8 秒で B→C）とグラフの点を同時に
  const f1 = S(lt, 6.6, 9.8), f2 = S(lt, 13.6, 16.8);
  const x = 4 * f1 + 3 * f2, y = x <= 4 ? 1.5 * x : -2 * x + 14;
  const P = Pat(T, x), back = S(lt, 20.3, 20.9), pa = S(lt, 6.0, 6.5) * (1 - back);
  shade(T, P, pa);
  pDot(P, pa, pa, x <= 4 ? [0, 28] : [-26, 0], 30);
  // b3：いちばん大きいのは P が B にあるとき → 図の P を B に置き直し、グラフの点を (4, 6) に
  if (back > 0){ shade(T, T.B, back); pDot(T.B, back, back, [0, 30], 30); dot(G(4, 6), 7, 'answer', back, 14); }
  if (f1 > 0) line(G(0, 0), G(4, 6), f1, 'answer', 3, 1, { glow: 8 });
  if (f2 > 0) line(G(4, 6), G(7, 0), f2, 'answer', 3, 1, { glow: 8 });
  if (pa > 0) dot(G(x, y), 7, 'answer', pa, 14);
  const moving = (f1 > 0 && f1 < 1) || (f2 > 0 && f2 < 1);
  if (moving){ const Q = G(x, y); line([Q[0], GO[1]], Q, 1, 'w', 1.2, .35, { dash: [4, 6] }); line([GO[0], Q[1]], Q, 1, 'w', 1.2, .35, { dash: [4, 6] }); }
  // 式のラベル（止めた画面でもわかるように）
  formula([v('y', 'answer'), op('='), fr([n('3', 'answer')], [n('2', 'answer')]), v('x', 'answer')], 540, 580, 30, .9 * S(lt, 9.6, 10.2));
  formula([v('y', 'answer'), op('='), n('−2', 'answer'), v('x', 'answer'), op('+'), n('14', 'answer')], 915, 620, 28, .9 * S(lt, 16.6, 17.2));
  // b3：いちばん大きいところ
  const pk = S(lt, 20.6, 21.2);
  if (pk > 0){
    const Q = G(4, 6);
    line([Q[0], GO[1]], Q, pk, 'w', 1.4, .55, { dash: [5, 6] });
    line([GO[0], Q[1]], Q, pk, 'w', 1.4, .55, { dash: [5, 6] });
    ring(Q, lerp(8, 30, S(lt, 21.0, 22.0)), 'answer', .9 * (1 - S(lt, 21.0, 22.0)), 2);
    text('(4, 6)', Q[0] - 70, Q[1] - 26, fM(30), 'answer', pk);
  }
}

/* ----- まとめ ----- */
function drawSum(lt){
  const a1 = S(lt, .3, 1.0), a2 = S(lt, 1.2, 1.9), a3 = S(lt, 2.4, 3.0);
  text('Pが{辺|へん}AB{上|じょう}（$x$が0から4）', 540, 330, fJ(32, 500), 'w', .85 * a1);
  formula([v('y', 'answer'), op('='), fr([n('3', 'answer')], [n('2', 'answer')]), v('x', 'answer')], 540, 420, 58, a1);
  text('Pが{辺|へん}BC{上|じょう}（$x$が4から7）', 540, 540, fJ(32, 500), 'w', .85 * a2);
  formula([v('y', 'answer'), op('='), n('−2', 'answer'), v('x', 'answer'), op('+'), n('14', 'answer')], 540, 612, 58, a2);
  text('グラフは (4, 6) で{折|お}れ{曲|ま}がる{折|お}れ{線|せん}', 540, 740, fJ(30), 'w', .75 * a3);
  // 小さな山の形
  const O = [420, 900], k = 34;
  poly([O, [O[0] + 4 * k, O[1] - 6 * k * .5], [O[0] + 7 * k, O[1]]], a3, 'answer', 2.6, .9, { glow: 6 });
  line([O[0] - 20, O[1]], [O[0] + 8 * k, O[1]], a3, 'w', 1.4, .5);
}
